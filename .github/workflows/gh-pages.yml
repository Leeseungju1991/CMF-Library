name: Deploy demo to GitHub Pages

# ⚠️ One-time manual step required before this workflow can deploy anything:
#   Repo → Settings → Pages → Build and deployment → Source → "GitHub Actions"
# Without that, the deploy-pages step below will fail even if the build succeeds.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ✅ 실제 Firebase 프로젝트(soom-fd5d3)를 사용하는 빌드.
      #    GITHUB_PAGES=true 로 서브패스(base)만 조정하고, Firebase 설정은
      #    src/firebase.ts 의 하드코딩 기본값(공개 식별자)을 사용한다.
      #    (데모/목데이터 빌드가 다시 필요하면 `npm run build:demo` 로 되돌릴 것)
      - name: Build (real Firebase)
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
